# ACMPC controller node.  Constants here are asserted against the study by
# `ros2 run acmpc_controller check_glue`; they are NOT a second source of truth.
/**:
  ros__parameters:
    mode: acmpc            # acmpc | nmpc1 | pid  (§9.8 incumbents on S0/S1)
    horizon: 10            # N_p; E-C sweeps {10,20,30,40} and marks (9.4) violations
    n_iter: 10             # iLQR iterations
    control_rate_hz: 50.0
    rate_hz: 50.0
    use_d: true            # feed the estimate through B_d into the prediction model
    dmod_mode: first_order # (4.13); 'none' zeroes the moment block -- report both
    # reference (9.5); the node REFUSES to fly an infeasible one
    A: 1.2
    B: 0.9
    omega: 1.0             # gentle 0.60 | moderate 1.00 | aggressive 1.45
    z0: 1.5
    vehicle:
      m: 2.064308
      T_max: 34.19432      # the ONE definition; recalibrate via check_ctbr --y-measured
      K_T: 8.54858e-06
      k_m: 0.016
      arm: 0.174
      g: 9.8066
      J: [0.023830955, 0.023830955, 0.043893959]
