# ACMPC controller node.  Constants here are asserted against the study by
# `ros2 run acmpc_controller check_glue`; they are NOT a second source of truth.
/**:
  ros__parameters:
    # `controller` is the name; it fixes both the solver mode and whether the
    # RDP estimate reaches the model.  ONE table (controller_node.CONTROLLERS)
    # so the label on a plot cannot disagree with the wiring behind it.
    controller: acmpc      # nmpc1 | acmpc | acmpc_adaptive | pid
    mode: ""               # non-empty overrides the table's solver mode (sweeps)
    reference: hold        # hold | lissajous.  The demo and E-0 fly `hold`.
    p_hold: [0.0, 0.0, 1.5]
    horizon: 10            # N_p; E-C sweeps {10,20,30,40} and marks (9.4) violations
    n_iter: 10             # iLQR iterations
    control_rate_hz: 50.0
    rate_hz: 50.0
    use_d: true            # feed the estimate through B_d into the prediction
                           # model.  ANDed with the controller's own entry, so
                           # it can force the estimate OFF but never ON: only
                           # acmpc_adaptive ever sees d_hat.
    dmod_mode: exact       # (4.11) exact in BOTH blocks: d = diag(m^-1 I,
                           # J_nom^-1) w.  The old 'closed_loop'/'first_order'
                           # modes were approximations of the moment block and
                           # are gone; 'none' zeroes it (an ablation).
    auto_arm: true         # request OFFBOARD and arm after arm_after_s
    arm_after_s: 1.5       # PX4 needs the setpoint stream BEFORE it accepts
    px4_namespace: ""      # e.g. /px4_1 for multi-vehicle
    topic_timeout_s: 30.0  # how long to wait for the graph before giving up
    # reference (9.5); the node REFUSES to fly an infeasible one
    A: 1.2
    B: 0.9
    omega: 1.0             # gentle 0.60 | moderate 1.00 | aggressive 1.45
    z0: 1.5
    vehicle:
      m: 2.064308
      T_max: 34.19432      # the ONE definition; recalibrate via check_ctbr --y-measured
      K_T: 8.54858e-06
      k_m: 0.016           # Gazebo momentConstant -- what the ROTORS produce
      k_m_ctrl: 0.05       # CA_ROTORn_KM -- what the PX4 ALLOCATOR believes (A3)
      arm: 0.174
      g: 9.8066
      # includes the rotors' own inertia, not just their point masses (A6)
      J: [0.023832493, 0.023935418, 0.043999954]
      # SIM_GZ_EC_MIN/MAX: Omega = om_min + c (om_max - om_min), NOT c*om_max (A2)
      om_min: 150.0
      om_max: 1000.0
      u_hover: 0.728741895     # 0.7287, not sqrt(mg/T_max) = 0.7694
      # SDF rotor aerodynamics, previously unmodelled (A5)
      rotor_drag_coeff: 8.06428e-05
      rolling_moment_coeff: 1.0e-06
