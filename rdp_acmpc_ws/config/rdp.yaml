# RDP estimator node (§9.5).
/**:
  ros__parameters:
    model_path: models/rdp_gru.npz   # written by study/export_estimator.py
    # no rate: one frame is pushed per /acmpc/status, i.e. at the controller's
    # 50 Hz and on its clock, exactly as the study's _frame26
    H: 64                  # 1.28 s at 50 Hz, per arXiv:2605.16015 (C5)
    filter_alpha: 0.0      # optional first-order causal filter (§9.11 step 4)
    smooth_n: 32           # rolling MEAN over 32 frames, the paper's smoothing
    train_reference: hold  # the RDP is trained on POSITION HOLD (E-0)
    budget_ms: 8.0         # watchdog; on failure d_hat = 0 and a fault is counted
    # Choose the encoder on LATENCY, not R^2.  export_estimator.py measures
    # rdp_infer p95 on the target machine and records it in the .npz metadata.
    require_actuator_motors: true    # refuse moment scenarios without it (§9.4)
