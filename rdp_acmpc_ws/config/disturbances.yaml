# disturbance_manager (§9.7).  S0..S6, deterministic and reproducible: the seed
# fixes every random draw and is recorded in the run config.
#
#   ros2 run disturbance_manager manager_node --ros-args \
#        --params-file config/disturbances.yaml -p scenario:=S2
#
# Episode timeline (§9.9): 0 - t_on nominal | t_on - t_off disturbed | then recovery.
# The episode clock starts once ros_gz_bridge has subscribed (+ settle_s).
#
# Scenario parameters (drawn in disturbance_manager/scenarios.py):
#   S0  nominal
#   S1  payload: mass x[1.10, 1.20] as a point mass at a 2-5 cm CG offset
#       (gravity wrench + its moment; inertia x[0.85, 1.15] recorded only)
#   S2  step: 0.12 m g force on x, 0.04 m g arm moment on y
#   S3  gust: 0.15 m g peak, smooth sin^2 envelope, random azimuth
#   S4  periodic force on x, 0.10 m g at 0.5 Hz (sweep_S4: 0.1..4 Hz + chirp)
#   S5  one motor (random index) at 90 % effectiveness -> needs actuator_motors
#   S6  S1 + S2 + S3 + S5 combined
/**:
  ros__parameters:
    scenario: S0
    seed: 0
    rate_hz: 50.0
    t_on: 5.0              # 0-5 s nominal
    t_off: 12.0            # 5-12 s disturbance active, then recovery
    apply_in_gazebo: true  # false: publish the ground truth only
    gz_world: default      # PX4's world name (make px4_sitl gz_x500)
    gz_model: x500_0       # PX4 instance 0
    settle_s: 1.0          # wait after the bridge subscribes, before t = 0
